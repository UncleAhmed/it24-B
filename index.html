<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Hello World</h1>
<input type="text" id="textbox" placeholder="Type something herre..." oninput="updateDiplay()">
<h1 id="displayText"> Text will appear here</h1>

<script>

    function updateDiplay(){
        var textbox = document.getElementById("textbox");
        var displayText = document.getElementById("displayText");
        displayText.textContent = textbox.value;    }
</script>
</body>
</html>
