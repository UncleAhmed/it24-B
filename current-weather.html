<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Current Weather</title>
</head>
<body>
<h1>Current Weather</h1>
<button onclick="getweather()">Get Weather</button>
<div id="weatherResult"></div>

<script>
    const apiKey = "eb97495e98e6fda08108e10bf8667e39";

    async function getWeather(){
        console.log("Prompted opened" + Date());
        const city = prompt ("Enter city name:");
        console.log ("Prompt closed" + Date());

        if (!city) {
            alert("No city entered. ");
            console.log("No city entered" + Date());
            return;
        }
        // Api call
        const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;
    
        try{
            const response = await fetch (url);
            if (!response.ok)throw new Error ("City not found");
        
                const data= await response.json();

                const weatherResult = document.getElementById ("weatherResult");
                weatherResult.innerHTML = `
                <h2>${data.name}, ${data.sys.country}<h2>
                    <p>Temperature : ${data.main.temp}<p>
                         <p>Weatherr : ${data.weather[0].description}<p>
                             <p>Humidity : ${data.main.humidity}% <p>
                                 <p>Wind Speed : ${dat.wind.speed} m/s<p>
                                    `;
               
                }catch (error){
                console.log("Error " + error.message);

            }  
                             
    }
    

</script>
    
</body>
</html>
